name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bootstrap vcpkg
        shell: cmd
        run: vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake --preset ninja

      - name: Build C++ core
        run: cmake --build --preset ninja

      - name: Run C++ tests
        run: ctest --preset ninja

      - name: Run JS tests
        env:
          FORGE_CORE_PATH: ${{ github.workspace }}\core\build\ninja\core\forge_core.exe
        run: npm run test:js

      - name: Build Electron bundle
        run: npm run build

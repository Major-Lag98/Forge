name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bootstrap vcpkg
        shell: cmd
        run: vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install npm dependencies
        run: npm ci

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Release)
        run: cmake --preset ninja-release

      - name: Build C++ core (Release)
        run: cmake --build --preset ninja-release

      - name: Run C++ tests (Release)
        run: ctest --preset ninja-release

      - name: Run JS tests
        env:
          FORGE_CORE_PATH: ${{ github.workspace }}\core\build\ninja-release\core\forge_core.exe
          FORGE_HELPER_ZERO_PATH: ${{ github.workspace }}\core\build\ninja-release\core\tests\forge_helper_zero.exe
        run: npm run test:js

      - name: Package Windows installer
        env:
          FORGE_CORE_PATH: ${{ github.workspace }}\core\build\ninja-release\core\forge_core.exe
        run: npm run build:win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
